name: Capstone (과제화)

on:
  schedule:
    - cron: '50 0,6,12,18 * * *'   # 6시간마다 :50
  workflow_dispatch:

permissions:
  contents: write        # 캡스톤 커밋
  pages: write           # Pages 배포
  id-token: write        # OIDC 토큰 (deploy-pages 필수)

jobs:
  capstone:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --break-system-packages \
            requests pyyaml mkdocs-material

      - name: Install Icarus Verilog
        run: sudo apt-get install -y iverilog

      - name: Git pull rebase
        run: git pull --rebase

      # ── 게이트 체크 ──────────────────────────────────────
      - name: Gate check
        run: |
          python3 tools/check.py
          python3 tools/audit.py
          python3 tools/capcheck.py --gate-only

      # ── 캡스톤 생성 ──────────────────────────────────────
      - name: Run capstone
        run: python3 -m harness.capstone
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify & build HTML
        run: |
          python3 tools/run_verify.py
          python3 tools/build.py

      # ── MkDocs 사이트 빌드 ───────────────────────────────
      - name: Build MkDocs site
        run: mkdocs build --strict

      # ── 캡스톤 결과 커밋 ─────────────────────────────────
      - name: Commit capstone artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add capstones/ inbox/ docs/
          git diff --staged --quiet || \
            git commit -m "capstone: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push

      # ── GitHub Pages 배포 (공식 방식) ────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
