<text x="524" y="16" class="colhead">주변장치</text>
<text x="774" y="16" class="colhead">외부</text>
<path d="M200,63.0 C362.0,63.0 362.0,63.0 524,63.0" class="link" marker-end="url(#ar)"/>
<text x="362.0" y="56.0" class="lbl" text-anchor="middle">clk</text>
<path d="M200,63.0 C362.0,63.0 362.0,227.0 524,227.0" class="link" marker-end="url(#ar)"/>
<text x="362.0" y="138.0" class="lbl" text-anchor="middle">clk</text>
<path d="M200,145.0 C362.0,145.0 362.0,227.0 524,227.0" class="link" marker-end="url(#ar)"/>
<text x="362.0" y="179.0" class="lbl" text-anchor="middle">rst</text>
<path d="M612.0,92 L612.0,198" class="link" marker-end="url(#ar)"/>
<text x="618.0" y="145.0" class="lbl" text-anchor="middle">tick_in</text>
