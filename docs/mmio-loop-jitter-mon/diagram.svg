<g class="k-clock"><rect x="24" y="34" width="176" height="58" rx="8"/><text x="112.0" y="58" text-anchor="middle" class="bname">CLK_100 100 MHz</text><text x="112.0" y="76" text-anchor="middle" class="bdesc">보드 클럭</text></g>
<g class="k-external"><rect x="24" y="116" width="176" height="58" rx="8"/><text x="112.0" y="140" text-anchor="middle" class="bname">BTNC</text><text x="112.0" y="158" text-anchor="middle" class="bdesc">리셋 버튼</text></g>
<g class="k-external"><rect x="774" y="34" width="176" height="58" rx="8"/><text x="862.0" y="58" text-anchor="middle" class="bname">LED[15:0]</text><text x="862.0" y="76" text-anchor="middle" class="bdesc">상태 LED</text></g>
<g class="k-internal"><rect x="524" y="34" width="176" height="58" rx="8"/><text x="612.0" y="58" text-anchor="middle" class="bname">tick_gen (내부 카운터)</text><text x="612.0" y="76" text-anchor="middle" class="bdesc">1kHz 틱 생성</text></g>
<g class="k-internal"><rect x="524" y="116" width="176" height="58" rx="8"/><text x="612.0" y="140" text-anchor="middle" class="bname">cfg_fsm (스타트업 설정)</text><text x="612.0" y="158" text-anchor="middle" class="bdesc">초기 설정 FSM</text></g>
<g class="k-ip"><rect x="524" y="198" width="176" height="58" rx="8"/><text x="612.0" y="222" text-anchor="middle" class="bname">loop_jitter_mon</text><text x="612.0" y="240" text-anchor="middle" class="bdesc">지터 측정 IP</text></g>
</svg>