<g class="k-top"><rect x="524" y="362" width="176" height="58" rx="8"/><text x="612.0" y="386" text-anchor="middle" class="bname">Basys3 최상위 래퍼</text><text x="612.0" y="404" text-anchor="middle" class="bdesc">board top</text></g>
