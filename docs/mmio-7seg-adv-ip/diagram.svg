<path d="M612.0,92 L612.0,198" class="link" marker-end="url(#ar)"/>
<text x="618.0" y="145.0" class="lbl" text-anchor="middle">seg_data, blank, dp</text>
<path d="M612.0,92 L612.0,280" class="link" marker-end="url(#ar)"/>
<text x="618.0" y="186.0" class="lbl" text-anchor="middle">bright[3:0]</text>
