<g class="k-peripheral"><rect x="524" y="444" width="176" height="58" rx="8"/><text x="612.0" y="468" text-anchor="middle" class="bname">pwm_ip</text><text x="612.0" y="486" text-anchor="middle" class="bdesc">PWM 2ch</text></g>
<g class="k-peripheral"><rect x="524" y="526" width="176" height="58" rx="8"/><text x="612.0" y="550" text-anchor="middle" class="bname">qenc_ip</text><text x="612.0" y="568" text-anchor="middle" class="bdesc">QDEC</text></g>
<g class="k-sim-master"><rect x="524" y="608" width="176" height="58" rx="8"/><text x="612.0" y="632" text-anchor="middle" class="bname">demo_master</text><text x="612.0" y="650" text-anchor="middle" class="bdesc">Sim master</text></g>
