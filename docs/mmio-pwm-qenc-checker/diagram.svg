<g class="k-board-wrapper"><rect x="524" y="34" width="176" height="58" rx="8"/><text x="612.0" y="58" text-anchor="middle" class="bname">basys3_top</text><text x="612.0" y="76" text-anchor="middle" class="bdesc">Board wrapper</text></g>
<g class="k-soc-core"><rect x="524" y="116" width="176" height="58" rx="8"/><text x="612.0" y="140" text-anchor="middle" class="bname">soc_top</text><text x="612.0" y="158" text-anchor="middle" class="bdesc">SoC core</text></g>
<g class="k-bus-decoder"><rect x="524" y="198" width="176" height="58" rx="8"/><text x="612.0" y="222" text-anchor="middle" class="bname">mmio_bus</text><text x="612.0" y="240" text-anchor="middle" class="bdesc">MMIO decoder</text></g>
<g class="k-peripheral"><rect x="524" y="280" width="176" height="58" rx="8"/><text x="612.0" y="304" text-anchor="middle" class="bname">gpio</text><text x="612.0" y="322" text-anchor="middle" class="bdesc">GPIO LED/SW</text></g>
