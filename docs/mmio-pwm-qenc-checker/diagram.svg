<text x="618.0" y="186.0" class="lbl" text-anchor="middle">mmio-lite</text>
<path d="M612.0,256 L612.0,280" class="link" marker-end="url(#ar)"/>
<text x="618.0" y="268.0" class="lbl" text-anchor="middle">sel_gpio</text>
<path d="M612.0,256 L612.0,362" class="link" marker-end="url(#ar)"/>
<text x="618.0" y="309.0" class="lbl" text-anchor="middle">sel_uart</text>
<path d="M612.0,256 L612.0,444" class="link" marker-end="url(#ar)"/>
<text x="618.0" y="350.0" class="lbl" text-anchor="middle">sel_pwm</text>
<path d="M612.0,256 L612.0,526" class="link" marker-end="url(#ar)"/>
<text x="618.0" y="391.0" class="lbl" text-anchor="middle">sel_qdec</text>
