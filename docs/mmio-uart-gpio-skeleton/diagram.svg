<g class="k-clock"><rect x="24" y="34" width="176" height="58" rx="8"/><text x="112.0" y="58" text-anchor="middle" class="bname">clk 100MHz</text><text x="112.0" y="76" text-anchor="middle" class="bdesc">보드 클럭 입력</text></g>
<g class="k-external"><rect x="24" y="116" width="176" height="58" rx="8"/><text x="112.0" y="140" text-anchor="middle" class="bname">btnU / btnC</text><text x="112.0" y="158" text-anchor="middle" class="bdesc">송신 트리거, 리셋</text></g>
<g class="k-cpu"><rect x="24" y="198" width="176" height="58" rx="8"/><text x="112.0" y="222" text-anchor="middle" class="bname">demo_master</text><text x="112.0" y="240" text-anchor="middle" class="bdesc">CPU 슬롯 (5상태 FSM)</text></g>
<g class="k-bus"><rect x="274" y="34" width="176" height="58" rx="8"/><text x="362.0" y="58" text-anchor="middle" class="bname">mmio_bus</text><text x="362.0" y="76" text-anchor="middle" class="bdesc">주소 디코드·읽기 mux</text></g>
<g class="k-periph"><rect x="524" y="34" width="176" height="58" rx="8"/><text x="612.0" y="58" text-anchor="middle" class="bname">gpio</text><text x="612.0" y="76" text-anchor="middle" class="bdesc">LED 16, SW 16</text></g>
<g class="k-periph"><rect x="524" y="116" width="176" height="58" rx="8"/><text x="612.0" y="140" text-anchor="middle" class="bname">uart_tx</text><text x="612.0" y="158" text-anchor="middle" class="bdesc">115200 8N1 송신</text></g>
<g class="k-external"><rect x="774" y="34" width="176" height="58" rx="8"/><text x="862.0" y="58" text-anchor="middle" class="bname">SW / LED</text><text x="862.0" y="76" text-anchor="middle" class="bdesc">스위치와 LED</text></g>
<g class="k-external"><rect x="774" y="116" width="176" height="58" rx="8"/><text x="862.0" y="140" text-anchor="middle" class="bname">RsTx (USB-UART)</text><text x="862.0" y="158" text-anchor="middle" class="bdesc">PC 터미널로 연결</text></g>
</svg>