<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 974 290" role="img" aria-label="블록 다이어그램">
<style>:root{--muted:#6a6a64;--line:#8a8a82;--text:#1d1d1b;--c-cpu:#e6edfc;--c-cpu-s:#2a5bd7;--c-bus:#f3ecd9;--c-bus-s:#a7791a;--c-per:#e3f2e6;--c-per-s:#2f7d46;--c-ext:#f4f4f1;--c-ext-s:#8a8a82;--c-clk:#f6e6ee;--c-clk-s:#b03a6b}@media (prefers-color-scheme: dark){:root{--muted:#a3a29b;--line:#8d8c85;--text:#ecebe6;--c-cpu:#1d2740;--c-cpu-s:#7ea2ff;--c-bus:#35301f;--c-bus-s:#d3a640;--c-per:#1c3223;--c-per-s:#6ac389;--c-ext:#262624;--c-ext-s:#8d8c85;--c-clk:#3a2230;--c-clk-s:#e17aa6}}
.colhead{font:600 11px sans-serif;fill:var(--muted)}
.link{fill:none;stroke:var(--line);stroke-width:1.5}.arrow{fill:var(--line)}
.lbl{font:11px sans-serif;fill:var(--muted)}
.bname{font:600 13px sans-serif;fill:var(--text)}.bdesc{font:11px sans-serif;fill:var(--muted)}
.k-cpu rect{fill:var(--c-cpu);stroke:var(--c-cpu-s)}.k-bus rect{fill:var(--c-bus);stroke:var(--c-bus-s)}
.k-periph rect,.k-memory rect{fill:var(--c-per);stroke:var(--c-per-s)}
.k-external rect{fill:var(--c-ext);stroke:var(--c-ext-s);stroke-dasharray:4 3}
.k-clock rect{fill:var(--c-clk);stroke:var(--c-clk-s)}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>
<text x="24" y="16" class="colhead">클럭·입력·마스터</text>
<text x="274" y="16" class="colhead">버스</text>
<text x="524" y="16" class="colhead">주변장치</text>
<text x="774" y="16" class="colhead">외부</text>
<path d="M112.0,174 L112.0,198" class="link" marker-end="url(#ar)"/>
<text x="118.0" y="186.0" class="lbl" text-anchor="middle">btnU</text>
<path d="M200,227.0 C237.0,227.0 237.0,63.0 274,63.0" class="link" marker-end="url(#ar)"/>
<text x="237.0" y="138.0" class="lbl" text-anchor="middle">mmio-lite</text>
<path d="M450,63.0 C487.0,63.0 487.0,63.0 524,63.0" class="link" marker-end="url(#ar)"/>
<text x="487.0" y="56.0" class="lbl" text-anchor="middle">sel/rdata</text>
<path d="M450,63.0 C487.0,63.0 487.0,145.0 524,145.0" class="link" marker-end="url(#ar)"/>
<text x="487.0" y="97.0" class="lbl" text-anchor="middle">sel/rdata</text>
<path d="M700,63.0 C737.0,63.0 737.0,63.0 774,63.0" class="link" marker-end="url(#ar)"/>
